services:
  backend:
    build:
      context: ./backend
    container_name: effective-mobile-backend
    networks:
      - app-network

  nginx:
    image: nginx:1.29-alpine
    container_name: effective-mobile-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
